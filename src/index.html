      align-items: center;

      padding: 1rem;

    .auth-card{

      border-radius: 2rem;
      padding: 2.5rem;
      width: 400px;
      max-width: 90%;
      border: 1px solid rgba(255,255,255,0.25);

      text-align: center;

      padding: 0.9rem;
      border-radius: 2rem;
      border: none;
      background: rgba(255,255,255,0.2);
      color: white;
      font-size: 1rem;
      margin: 1rem 0;
      outline: none;
      text-align: center;
    }
    input::placeholder{color:#94a3b8;}
    input:focus{background: rgba(255,255,255,0.3);}
    button{
      background: #8b5cf6;
      width: 100%;
      padding: 0.8rem;
      border: none;
      border-radius: 2rem;
      font-weight: bold;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover{background: #7c3aed; transform: translateY(-2px);}
    .error-msg{
      color: #f87171;
      margin-top: 1rem;
      font-size: 0.85rem;
      display: none;
    }
    .loading-msg{
      color: #94a3b8;
      margin-top: 0.8rem;
      display: none;
      font-size: 0.8rem;
    }
    footer{margin-top: 2rem; font-size: 0.7rem; color: #64748b;}
